name: Install reference video export tools
description: Restore or download, verify, and install the pinned Linux x64 tools
inputs:
  version:
    description: Exact version reported by both tools
    default: n8.1.3-27-g8dca1586f4-20261031
  url:
    description: BtbN month-end static GPL build (FFmpeg libraries linked statically)
    default: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
  sha256:
    description: Archive SHA-256 from checksums.sha256 in the same release
    default: '41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380'
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      id: archive
      with:
        path: ${{ runner.temp }}/reference-video-tools.tar.xz
        key: reference-video-tools-${{ inputs.sha256 }}
    - shell: bash
      env:
        VIDEO_TOOLS_URL: ${{ inputs.url }}
        VIDEO_TOOLS_VERSION: ${{ inputs.version }}
        VIDEO_TOOLS_SHA256: ${{ inputs.sha256 }}
        VIDEO_TOOLS_CACHE_HIT: ${{ steps.archive.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-video-tools.sh"
    # Save inline so the same step timeout includes the upload, and a dependent
    # job can restore the verified archive as soon as this job finishes.
    - uses: actions/cache/save@v4
      if: steps.archive.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/reference-video-tools.tar.xz
        key: reference-video-tools-${{ inputs.sha256 }}
