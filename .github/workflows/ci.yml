# CI: typecheck, lint, and the selftest suite.
#
# The selftest is the gate that matters. Every assertion has a mutant that makes
# it fire, so a green run means the failures are still reachable — not merely
# that nothing threw. Nothing here asserts timing, and no step is allowed to
# report success on an empty corpus.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release pull request gets a `pull_request` run like any other. What
  # GITHUB_TOKEN costs is not the run but its permission to start: the run lands
  # in `action_required`, so that pull request's required check reads as blocked
  # rather than absent, and approving it is a standing step of every cut — see
  # RELEASING.md. A run started from the Actions tab cannot stand in for that
  # approval; a required check is matched by the run that reported it, not by the
  # SHA. So the trigger below is a manual lever for running the suite on an
  # arbitrary ref, and nothing more.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/check_readme.test.ts
      - run: bun scripts/check_readme.ts

  # The selftest as n shards and their merge (issues #1116, #1249). The matrix,
  # the merge and the corpus fetch live in selftest-shards.yml, which
  # release.yml calls on the tag it is about to publish, so the gate CI reads
  # and the gate a publish reads are one definition rather than two copies that
  # can drift (`CUR120`). That file carries the measurement behind n = 6 and
  # the reason the selftest step is exactly `bun run selftest`.
  selftest:
    uses: ./.github/workflows/selftest-shards.yml

  # The verdict, under the name the pull requests are required to pass. A
  # called workflow's jobs report as "selftest / test", never as `test`, so this
  # job is the required check and it reads exactly one thing: whether the merge
  # in selftest-shards.yml exited 0, through that job's `verdict` output. Not
  # `needs.selftest.result`, which a shard job's own failure also reads as red
  # where the merge alone decided before; the merge is still the verdict. It
  # runs when the call failed (`!cancelled()`) so a red merge is a red `test`
  # rather than a skipped one, and it checks nothing out — what it reads is
  # already decided.
  test:
    needs: selftest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The merge of every shard is the verdict
        env:
          VERDICT: ${{ needs.selftest.outputs.verdict }}
        run: |
          if [ "$VERDICT" != green ]; then
            echo "the merge of every shard did not exit 0 — read the \"selftest / test\" job of this run for the suite and its FAIL lines" >&2
            exit 1
          fi
          echo "the merge of every shard exited 0"

  # Linux's own readings of the gallery's builds and renders: measurement only,
  # gating nothing. A job of its own since #1116, because neither half needs a
  # shard's output — each builds into its own work directory from the recipes —
  # so in a shard it would lengthen that shard by the 52 s the four steps took
  # on run 37131671933, and in the merge job it would hold the verdict back by
  # them and by the corpus fetch they need. Alone it runs beside the shards, on
  # every run whatever the shards found — what the `!cancelled()` these steps
  # carried after the one-process selftest was for.
  linux-readings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The render recipes include the fetched exports' rows, so this job reads the corpus too, fetched as the shards fetch it.
      - name: Fetch the Spine example corpus
        run: bun run fetch-examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gallery's model documents as THIS machine writes them (issue #942).
      # The tracked base holds the Spine files only, because `gallery/look`'s
      # `skeleton.model.json` was measured to differ between a macOS build and
      # this runner while `skeleton.json` and the atlas did not
      # (tools/emit_hashes.ts, `## base`). A second machine's document can only
      # be read here, so this uploads it: the whole `emit-hashes/1` run over the
      # base's recipes (every row's hashes, the model documents included) and
      # `gallery/look`'s three files. Measurement only: it gates nothing.
      - name: Build the gallery's model documents on Linux
        run: |
          bun tools/emit_hashes.ts run --recipes tools/emit_hashes.base.json \
            --out "$RUNNER_TEMP/eh/hashes.json" --work "$RUNNER_TEMP/eh/work"
          rig=$(ls "$RUNNER_TEMP"/eh/work/*/gallery/look/rig.json)
          mkdir -p "$RUNNER_TEMP/eh/look"
          cp "${rig%/gallery/look/rig.json}"/out/* "$RUNNER_TEMP/eh/look/"
      - name: Upload them as the model-documents-linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-documents-linux
          path: |
            ${{ runner.temp }}/eh/hashes.json
            ${{ runner.temp }}/eh/look/
          if-no-files-found: error

      # Every render of every recipe as THIS machine draws it (issue #965, step
      # 3a of #380). The tracked render base (`tools/render_hashes.base.json`)
      # holds the gallery PNGs' PIXEL hashes only — this runner's PNG encoder
      # wrote different bytes for the same pixels than the macOS base's (PR
      # #972) — and `RH05` in the selftest above checks it on every run. The
      # run uploaded here carries both hashes per PNG; the geometry files, the frames sidecar, the bone snapshots
      # and the framing numbers carry full doubles off libm and were measured to
      # move under a one-ulp change of it (tools/render_hashes.ts, `## base`), so
      # a second machine's reading of them — and of the fetched exports' rows,
      # which no tracked file holds — can only be taken here. Measurement only:
      # it gates nothing.
      - name: Render every recipe on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/rh"
          bun tools/emit_hashes.ts recipes --out "$RUNNER_TEMP/rh/recipes.json"
          bun tools/render_hashes.ts run --recipes "$RUNNER_TEMP/rh/recipes.json" \
            --out "$RUNNER_TEMP/rh/hashes.json" --work "$RUNNER_TEMP/rh/work"
      - name: Upload them as the render-hashes-linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-hashes-linux
          path: ${{ runner.temp }}/rh/hashes.json
          if-no-files-found: error

  # Whether the PACKAGE runs, which no other instrument here asks (issue #556).
  #
  # ROADMAP.md's fourth condition for 1.0 is that the published package works on
  # a machine that has never seen this repository, "checked mechanically, every
  # release". Everything that existed reads a LIST: `prepublishOnly` gates the
  # source tree, the `ships` job (squash-text.yml) reads `npm pack --dry-run` path lists at
  # both ends of a landing, and `CUR16` resolves the relative imports of shipped
  # modules. None of them runs the thing. Two smokes had been taken by hand after
  # the fact, on v0.20.0 and v0.20.2, and the tree records neither — a check
  # somebody remembers to do is the `✅ applied` antipattern this repository
  # already has a judgment about.
  #
  # ⭐ **It is a separate job on purpose, with no `bun install` in it.** The
  # question is whether a stranger's machine can run the package, and a job that
  # had first installed this repository's dev dependencies would be answering it
  # with the repository's own tooling on hand. `scripts/install_smoke.ts` imports
  # nothing but node builtins for the same reason, so this job needs bun to run
  # the script, node and npm to install, and the network to reach the registry
  # for `@esotericsoftware/spine-core`. The install itself fetches nothing: the
  # package declares no dependencies (the runtime is a devDependency since
  # #1066), and phase 1 of every case holds that it arrived without one, that
  # `rigc --version` names `cli_core.ts`, and that `rigc build` there writes the
  # model document without it. Phase 2 is the one fetch — the runtime
  # installed beside the package at the version the package declares, after which
  # the same `rigc` has to name `cli.ts` and build through the round trip — and
  # phase 3 removes it again and runs `render`, `check` and `skills install`
  # without it.
  #
  # 🌱 **The plants run here too, and that is the point of running them.** The
  # battery is nine cases: a correct tarball builds, the same tarball installed
  # at a path with spaces and non-ASCII in it builds, and seven packages broken
  # on purpose — `tools/plate.ts` out of `files`, `src/validate.ts` out of the
  # packed tree, `@esotericsoftware/spine-core` put back in `dependencies`,
  # `cli_core.ts` out of `files` (those two #1061's), `skills` out of `files`,
  # `exports` removed, and `exports` cut down to its named entries — each of
  # which has to make the smoke RED naming what went missing, at the step where
  # it was planted. A plant is patched into an extraction of the tarball and
  # packed again from there, so nothing in the checkout is modified and no
  # restore can be forgotten. Without them this job is a gate nobody has seen
  # fail; with them every run has seen it fail seven times. The list is
  # `battery` in `scripts/install_smoke.ts`; this paragraph restates it.
  #
  # 🕳️ **What it cannot see**, stated rather than left to be assumed: it runs the
  # tarball this tree packs, which is not the tarball npm serves until a publish
  # makes it one. That half is `release.yml`'s confirmation step, which runs the
  # same script with `--source registry` after the publish — and the reason it is
  # a confirmation rather than the gate is that its own firing cannot be observed
  # without publishing something broken, while this one's can, seven times a run.
  installs:
    runs-on: ubuntu-latest
    # Nine cases — a pack and an install each, and phase 2's install of the
    # runtime where a case reaches it — measured at 56s for the whole job, setup
    # included, on run 36974234251 (main at v2.0.0); five cases had measured
    # 9.4s on a workstation before #1066. The ceiling is for a slow registry,
    # not for the work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # npm is what packs and installs, and the `bin` shim is a Node script, so
      # the runner's own node is not incidental here — it is half of what is
      # under test.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The package installs into an empty directory and builds a rig
        run: bun run smoke

  # The same smoke where the `installs` job above does not reach (issue #1214):
  # a macOS runner and a Windows runner, each on the Bun `oven-sh/setup-bun`
  # resolves today, as `installs` is on Linux. The smoke only, as `installs` is:
  # the selftest is the tree's question and this is the install's.
  #
  # ⚖️ `package.json` declares `engines.bun` (`>=1.4.0`), and that floor is
  # declared rather than tested in CI: every leg here runs the Bun the action
  # resolves, and older-version compatibility on the 1.4 line is handled as an
  # issue when a report arrives (issue #1570).
  #
  # 🪟 Windows needed repairs in `scripts/install_smoke.ts`, each named where
  # it is made: `command -v` through cmd.exe, the `.bin/rigc` shell-script
  # shim, an absolute-link test that only knew `/`, a `PATH` key Windows spells
  # `Path` — found by reading — and, from this leg's first run, `rigc.cmd`
  # refused without a shell (`EINVAL`) and the temp directory's 8.3 short name
  # read as "not under" its long one. Bare `npm` was measured to spawn there.
  #
  # ⛔ Not a required check — that is a setting of the repository and not
  # something a file in the tree can assert. `installs` stays the gate.
  installs-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # A red on one platform is no reason not to read the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The package installs into an empty directory and builds a rig
        run: bun run smoke
