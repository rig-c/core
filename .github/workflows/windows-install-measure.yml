# Temporary paired launcher diagnostic for #1702. Remove before PR ready.
name: windows-install-measure
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  pack:
    if: >-
      github.event.label.name == 'core-1702-launcher' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack one clean tarball without installing project dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostic-pack"
          npm pack "$GITHUB_WORKSPACE" --pack-destination "$RUNNER_TEMP/diagnostic-pack" --silent
      - uses: actions/upload-artifact@v4
        with:
          name: install-diagnostic-package
          path: ${{ runner.temp }}/diagnostic-pack/*.tgz
          if-no-files-found: error
          retention-days: 7
  measure:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: install-diagnostic-package
          path: ${{ runner.temp }}/diagnostic-package
      - name: Pair original and explicit Node launchers under the same Bun parent
        shell: pwsh
        env:
          MEASURE_ROOT: ${{ runner.temp }}/install-diagnostic
          MEASURE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:MEASURE_ROOT 'artifacts'
          New-Item -ItemType Directory -Force $out | Out-Null
          try {
            $defender = @{ status = Get-MpComputerStatus -ErrorAction Stop | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AMRunningMode, AntivirusSignatureVersion; exclusions = @((Get-MpPreference -ErrorAction Stop).ExclusionPath) }
          } catch { $defender = @{ status = 'SKIP_DEFENDER_STATUS: ' + $_.Exception.Message } }
          $defender | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'defender.json')
          $env:MEASURE_NODE = (Get-Command node.exe -ErrorAction Stop).Source
          $env:MEASURE_NPM_CLI = Join-Path (Split-Path (Get-Command npm.cmd -ErrorAction Stop).Source) 'node_modules/npm/bin/npm-cli.js'
          $tarballs = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'diagnostic-package/*.tgz'))
          if ($tarballs.Count -ne 1) { throw 'Expected exactly one shared tarball' }
          node tools/windows_install_measure.mjs --tarball $tarballs[0].FullName
          exit $LASTEXITCODE
      - name: Preserve complete or interrupted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-diagnostic/artifacts/
          if-no-files-found: error
          retention-days: 7
