# Release: triggered by pushing a deliberate vX.Y.Z tag on main, with no credential to leak.
#
# Pushing a version tag vX.Y.Z (after merging the release commit to protected
# main) runs this workflow. The `plan` job checks out main's history and tags,
# requires a strict vX.Y.Z tag ref, resolves the tag to a full commit SHA via
# the commits API, requires the run's GITHUB_SHA and the local tag commit to
# equal that SHA, verifies the commit is reachable from origin/main, verifies
# package.json in the tagged commit tree matches `@rig-c/core@X.Y.Z`, and
# refuses a version the registry already serves or a tag older than
# `@rig-c/core@latest`. The same run publishes to npm over OIDC (trusted
# publishing) — no npm token, no OTP. It publishes the package three times,
# under three names: `@rig-c/core`, the name in package.json, and two aliases
# carrying the same files at every version — `rig-c`, the convenience unscoped
# name (issue #1258), and `spine-rigc`, the name it first shipped under (issue
# #1258). `ALIASES` in scripts/alias_tarball.ts is the list; CUR122 holds the
# publish steps and both confirmation calls below to it.
#
# The cut resolves its target in plan, then reuse looks for successful CI
# coverage of the identical Git tree. A miss runs the common sharded gate.
# admit handles the skipped-gate result and publishes one ready output.
# The publish job verifies the source proof again, or the exact-commit tally
# together with successful typecheck/lint/merge coverage, before packing all
# three tarballs. A refused proof/tally executes the original full chain once.
# The folder prepublishOnly hook remains available for manual publication.
# CUR119/120/131 hold this graph and its dispatch boundaries.
#
# Before emitting publish=true, plan resolves the tag through the commits API
# and refuses PROVENANCE_SHA_MISMATCH if the run's GITHUB_SHA or local tag
# commit does not match the resolved commit SHA. gate and publish consume the
# verified full SHA; publish also retains its checked-out HEAD guard (#1542,
# #1551).
#
# A failure after the tag is pushed leaves a version unpublished (issue #1504:
# a transient signing-service 502 on `npm publish --provenance`). A publish by
# hand would lose provenance, and the trusted publisher names this file. Such a
# tag is published by a dispatch with the `tag` input
# (`gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z`, for a tag carrying
# the guard below): `plan` resolves the tag through the same selector, then the
# same `gate` and the same `publish` run over it, from this same filename. The
# trusted publisher is unchanged, and `plan` and `publish` refuse a dispatch
# whose ref or SHA differs from the tag's commit before any name is published
# (RELEASE_REF_NOT_TAG, PROVENANCE_SHA_MISMATCH, issue #1542). There is no path
# to `publish` that does not pass the gate (RELEASING.md, "Republishing a cut
# whose publish failed"). `CUR131` holds that shape and names each refusal.
#
# The dispatch takes exactly one of two inputs, both optional, because GitHub
# refuses a dispatch that omits a required input and an omitted string input
# reads as the empty string: `tag` publishes a cut tag (`plan` → `gate` →
# `publish`), `version` re-runs a confirmation (`confirm` alone). Both, or
# neither, is refused by name in `plan` (RELEASE_DISPATCH_INPUT) and runs
# nothing else.
#
# Two constraints are load-bearing, do not "simplify" them away:
#   - Every publish must stay in THIS file. npm's trusted publisher for each
#     name — @rig-c/core, rig-c and spine-rigc, one form per package on npmjs.com — is
#     pinned to the workflow filename `release.yml`.
#   - It must stay on a GitHub-hosted runner. npm does not support OIDC from
#     self-hosted runners.
name: release

on:
  push:
    tags: ['v*']
  # Two things on demand, one per dispatch:
  #   - `version`: re-run a confirmation that ran out of wait, publishing
  #     nothing (issue #563: the confirmation is the last step of a cut and the
  #     registry can take minutes to serve what was just published, so the
  #     outcome "not confirmed yet" has to be repairable by itself). Such a
  #     dispatch reaches the `confirm` job and nothing else: `plan`'s `if` does
  #     not admit a dispatch with a version and no tag, and `gate` and
  #     `publish` need `plan`.
  #   - `tag`: publish an existing release tag on main whose publish did not
  #     land (issue #1504). `plan`'s resolve step refuses a non-tag workflow
  #     ref (RELEASE_REF_NOT_TAG), a tag not of the form vX.Y.Z
  #     (RELEASE_TAG_FORM), a prerelease tag (RELEASE_TAG_PRERELEASE:
  #     everything here publishes under latest, and there is no dist-tag path
  #     to send one down until a card configures one and removes this refusal
  #     with it), an unresolved tag commit (RELEASE_TAG_UNRESOLVED), a run or
  #     local tag SHA mismatch (PROVENANCE_SHA_MISMATCH), a commit not
  #     reachable from origin/main (RELEASE_TAG_NOT_ON_MAIN), a tagged commit
  #     whose package.json is not @rig-c/core@X.Y.Z
  #     (RELEASE_TAG_VERSION_MISMATCH), a version the registry already serves
  #     under @rig-c/core (RELEASE_ALREADY_PUBLISHED) and a version below the
  #     registry's latest (RELEASE_TAG_BELOW_LATEST: npm 12.2.0's publish
  #     refuses to put latest on a version below the highest one implicitly,
  #     and the publish steps below pass no `--tag`). A tag it resolves runs
  #     the whole `gate` and then `publish`, as the tag push would have.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag whose publish did not land, e.g. v2.64.1 (leave version empty)
        required: false
        type: string
      version:
        description: The published version to confirm, without the leading v, e.g. 2.64.1 (leave tag empty)
        required: false
        type: string

permissions: {}

concurrency:
  # One group for every run that may publish, and one for a confirmation
  # (issue #1510). A push cut and a `tag` dispatch both reach `publish`, so they
  # share `release-publish`: a `tag` dispatch queues behind a cut in flight and
  # a cut behind a republish, and two pushes still serialise. A `version`
  # dispatch publishes nothing and runs in `release-confirm`, so it never waits
  # behind a release. The ref is not in the group, because the registry is one
  # per package rather than per ref and a dispatch may name any ref. Keyed on
  # the event name alone, as it was, a republish and a cut never queued behind
  # each other while a confirmation queued behind a republish. `CUR132`
  # evaluates this expression over a push, a `tag` and a `version` dispatch.
  group: release-${{ (github.event_name == 'workflow_dispatch' && inputs.tag == '') && 'confirm' || 'publish' }}
  cancel-in-progress: false

jobs:
  # 🔒 Triggered by a v* tag push or a `tag` dispatch (not a confirmation
  # dispatch alone). Checks out main with full history and tags, and resolves
  # the release tag only when the workflow ref is refs/tags/vX.Y.Z, the tag's
  # commit equals GITHUB_SHA and the local tag commit, is reachable from
  # origin/main, carries @rig-c/core@X.Y.Z in the tagged commit's package.json,
  # is not yet served by the registry, and is not below @rig-c/core@latest. Its
  # outputs `publish`, `tag` and `sha` are what `reuse`, `gate` and `publish`
  # read, whichever event resolved them.
  plan:
    if: ${{ github.event_name == 'push' || inputs.tag != '' || inputs.version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # fetch main history and tags to validate the release commit
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # What to publish: a pushed or dispatched vX.Y.Z tag whose workflow ref
      # is refs/tags/vX.Y.Z, whose commit matches GITHUB_SHA and the local tag,
      # is reachable from origin/main, carries matching @rig-c/core@X.Y.Z in
      # the tagged commit's package.json, is not on the registry yet, and is not
      # below @rig-c/core@latest. Each refusal is one `::error::` line naming
      # its rule, and fails this job, so `gate` and `publish` never start. The
      # inputs reach the script through the environment, never interpolated;
      # `CUR131` and `CUR133` hold this step. The semver order is computed in
      # node, not `sort -V`, which sorts 1.0.0-rc.1 after 1.0.0.
      - name: Resolve the tag to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_TAG" ] && [ -n "$INPUT_VERSION" ]; then echo "::error::RELEASE_DISPATCH_INPUT: both tag \"$INPUT_TAG\" and version \"$INPUT_VERSION\" were given; a dispatch takes tag (publish a cut tag) or version (re-run a confirmation), one of them"; exit 1; fi
            if [ -z "$INPUT_TAG" ]; then echo "::error::RELEASE_DISPATCH_INPUT: neither tag nor version was given; a dispatch takes tag (publish a cut tag) or version (re-run a confirmation), one of them"; exit 1; fi
            release_tag="$INPUT_TAG"
          elif [ "$EVENT" = push ]; then
            case "$REF" in
              refs/tags/*) release_tag="${REF#refs/tags/}" ;;
              *) echo "::error::RELEASE_REF_NOT_TAG: workflow ref \"$REF\" is not refs/tags/vX.Y.Z"; exit 1 ;;
            esac
          else
            echo "::error::RELEASE_REF_NOT_TAG: unsupported event \"$EVENT\""; exit 1
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::RELEASE_TAG_FORM: \"$release_tag\" is not vX.Y.Z (or vX.Y.Z-<prerelease>)"; exit 1; fi
          case "$release_tag" in *-*) echo "::error::RELEASE_TAG_PRERELEASE: $release_tag is a prerelease; this workflow publishes under latest only — its publish steps pass no --tag — so a prerelease cut or dispatch would move latest onto it (RELEASING.md)"; exit 1;; esac
          if [ "$REF" != "refs/tags/$release_tag" ]; then echo "::error::RELEASE_REF_NOT_TAG: workflow ref \"$REF\" is not refs/tags/$release_tag; dispatch with gh workflow run release.yml --ref $release_tag -f tag=$release_tag"; exit 1; fi
          # The commits API peels annotated tags; the refs API returns their tag-object SHA.
          # An explicit tag ref avoids resolving a branch with the same name.
          if ! tag_sha="$(gh api "repos/$REPO/commits/refs%2Ftags%2F$release_tag" --jq .sha)"; then echo "::error::RELEASE_TAG_UNRESOLVED: cannot resolve $release_tag to a commit"; exit 1; fi
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::RELEASE_TAG_UNRESOLVED: $release_tag did not resolve to a full commit SHA"; exit 1; fi
          if [ "$GITHUB_SHA" != "$tag_sha" ]; then echo "::error::PROVENANCE_SHA_MISMATCH: the run's GITHUB_SHA $GITHUB_SHA is not $release_tag's commit $tag_sha; the tag remains cut; recover with gh workflow run release.yml --ref $release_tag -f tag=$release_tag"; exit 1; fi
          if ! local_sha="$(git rev-parse --verify --quiet "refs/tags/$release_tag^{commit}")"; then echo "::error::RELEASE_TAG_NOT_ON_MAIN: tag $release_tag does not resolve to a local commit"; exit 1; fi
          if [ "$local_sha" != "$tag_sha" ]; then echo "::error::PROVENANCE_SHA_MISMATCH: fetched tag $release_tag ($local_sha) does not match resolved commit $tag_sha"; exit 1; fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then echo "::error::RELEASE_TAG_NOT_ON_MAIN: origin/main was not fetched"; exit 1; fi
          if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main; then echo "::error::RELEASE_TAG_NOT_ON_MAIN: $release_tag ($tag_sha) is not reachable from origin/main"; exit 1; fi
          version="${release_tag#v}"
          if ! pkg_json="$(git show "$tag_sha:package.json" 2>/dev/null)"; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: cannot read package.json from $release_tag ($tag_sha)"; exit 1; fi
          if ! pkg_id="$(PKG_JSON="$pkg_json" node -e 'const p = JSON.parse(process.env.PKG_JSON); if (typeof p.name === "string" && typeof p.version === "string") process.stdout.write(p.name + "@" + p.version); else process.exit(1);' 2>/dev/null)"; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: invalid package.json in $release_tag ($tag_sha)"; exit 1; fi
          if [ "$pkg_id" != "@rig-c/core@$version" ]; then echo "::error::RELEASE_TAG_VERSION_MISMATCH: $release_tag ($tag_sha) package.json is $pkg_id, expected @rig-c/core@$version"; exit 1; fi
          if served="$(npm view "@rig-c/core@$version" version 2>/dev/null)" && [ "$served" = "$version" ]; then echo "::error::RELEASE_ALREADY_PUBLISHED: the registry already serves @rig-c/core@$version; the aliases follow it, so a version up under the package name is not dispatched again (RELEASING.md)"; exit 1; fi
          if latest="$(npm view "@rig-c/core" version 2>/dev/null)" && [ -n "$latest" ] && [ "$(VERSION="$version" LATEST="$latest" node -e '
            const parse = (v) => { const [core, pre] = v.split("-", 2); return { core: core.split(".").map(Number), pre: pre === undefined ? null : pre.split(".") }; };
            const ids = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i] === undefined) return -1; if (b[i] === undefined) return 1; const na = /^[0-9]+$/.test(a[i]), nb = /^[0-9]+$/.test(b[i]); if (na && nb && Number(a[i]) !== Number(b[i])) return Number(a[i]) - Number(b[i]); if (na !== nb) return na ? -1 : 1; if (!na && a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; };
            const cmp = (x, y) => { const a = parse(x), b = parse(y); for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i]; if (a.pre === null || b.pre === null) return a.pre === b.pre ? 0 : a.pre === null ? 1 : -1; return ids(a.pre, b.pre); };
            process.stdout.write(cmp(process.env.VERSION, process.env.LATEST) < 0 ? "below" : "not-below");
          ')" = below ]; then echo "::error::RELEASE_TAG_BELOW_LATEST: $release_tag is below the registry's latest @rig-c/core@$latest; the registry will not move latest implicitly and these publication steps pass no --tag, so it is not published by this dispatch (RELEASING.md)"; exit 1; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$release_tag" >> "$GITHUB_OUTPUT"; echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  # A no-cut push starts none of the lookup/gate/publish work. Dispatch cannot
  # reuse a source verdict and follows the same fresh gate as a push miss.
  reuse:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha || needs.plan.outputs.tag }}
      - id: lookup
        uses: rig-c/core/.github/actions/tree-verdict@d43f730151d5db0b71682a1a4057145cd4a95fa8
        with:
          declaration: scripts/tree-verdict.json
          purpose: ci

  # The common sharded gate remains the fallback. Its successful merge writes
  # the exact-commit tally; the collector in ci.yml executes no chain.
  gate:
    needs: [plan, reuse]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.reuse.outputs.reused != 'true' }}
    permissions:
      contents: read # check out the tag
    uses: ./.github/workflows/selftest-shards.yml
    with:
      # Push uses the verified SHA; dispatch retains its tag and HEAD guard.
      ref: ${{ needs.plan.outputs.sha || needs.plan.outputs.tag }}

  # A skipped reused gate is handled here; publish pairs its ready check with
  # !cancelled() so Actions' implicit success() does not skip on a skipped gate.
  admit:
    needs: [plan, reuse, gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.decision.outputs.ready }}
      fresh: ${{ steps.decision.outputs.fresh }}
    steps:
      - id: decision
        env:
          CUT: ${{ needs.plan.outputs.publish }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          LOOKUP_RESULT: ${{ needs.reuse.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          VERDICT: ${{ needs.gate.outputs.verdict }}
        run: |
          set -eu
          ready=false
          fresh=false
          if [ "$GATE_RESULT" = success ] && [ "$VERDICT" = green ]; then fresh=true; fi
          if [ "$CUT" = true ] && [ "$LOOKUP_RESULT" = success ]; then
            if [ "$REUSED" = true ] || [ "$fresh" = true ]; then ready=true; fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, admit]
    if: ${{ !cancelled() && needs.admit.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    # Run 42069082954: six selftest step durations sum to 2203 s, plus
    # typecheck 22 s + lint 21 s = 2246 s of observed chain work. This is a
    # shard-work budget, not a measured one-process fallback duration.
    # 2246 s + registry wait 900 s + setup/pack/publish/variation margin 454 s
    # = 3600 s. Accepted whole-chain evidence skips the reader's chain work.
    timeout-minutes: 60
    permissions:
      contents: read # check out the tag
      actions: read # revalidate the source run, attempt and coverage
      pull-requests: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not resolve a push's mutable tag again after the plan checked it.
          ref: ${{ needs.plan.outputs.sha || needs.plan.outputs.tag }}

      # npm's provenance reads GITHUB_SHA, not the tag checkout's HEAD. Keep
      # this before every publish, including aliases, and leave pushes alone.
      # A dispatch runs the workflow on its selected ref: only refs containing
      # this guard enforce it; --ref on an old tag cannot acquire a newer guard.
      - name: Refuse dispatched provenance from a different commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            checked_out_sha="$(git rev-parse HEAD)"
            if [ "$GITHUB_SHA" != "$checked_out_sha" ]; then
              echo "::error::PROVENANCE_SHA_MISMATCH: GITHUB_SHA=$GITHUB_SHA differs from checked-out HEAD=$checked_out_sha; dispatch from a ref at the tag's commit whose release.yml contains this guard"
              exit 1
            fi
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC exchange landed in npm 11.5.1.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # The repository's lockfile is bun.lock — there is no package-lock.json,
      # so `npm ci` has nothing to read. Deps exist only to let prepublishOnly
      # run its gates; the publish itself is npm's.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: reuse
        uses: rig-c/core/.github/actions/tree-verdict@d43f730151d5db0b71682a1a4057145cd4a95fa8
        with:
          declaration: scripts/tree-verdict.json
          purpose: publish

      # The named core reader may execute the full chain when evidence is
      # absent or refused, so its corpus is fetched before the reader. It
      # verifies a clean current tree proof or authentic exact tally coverage
      # before any pack. All publications below consume tarballs.
      #
      # 🚨 This used to say the selftest needs no corpus, and that stopped being
      # true when the core suite landed: with no examples/ its corpus controls
      # are red rather than HOLEs (a construct no row reaches is never a pass,
      # and a plant that reaches nothing is a fault). v1.6.0 was tagged and
      # released on GitHub and then failed this gate on four of them, because
      # the publish was measuring a different environment from the gate that
      # admitted every commit (issue #1003). `CUR112` in selftest.ts holds this
      # step before the publish, under the publish's own condition.
      - name: Fetch the Spine example corpus
        run: bun run fetch-examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the merged tally the gate wrote
        if: ${{ needs.admit.outputs.fresh == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: selftest-merged-tally
          path: ${{ runner.temp }}/merged-tally

      # The only chain reader, before every pack and publish. A refused proof
      # and tally runs the original chain once; its nonzero exit stops the job.
      # All three publications consume tarballs and invoke no folder hook.
      - name: Verify the complete prepublish chain
        id: publication-reader
        env:
          TREE_VERDICT_TOOLS: ${{ steps.reuse.outputs.tooling-path }}
          TREE_VERDICT_PATH: ${{ steps.reuse.outputs.verdict-path }}
          RIGC_PREPUBLISH_TALLY: ${{ runner.temp }}/merged-tally/selftest_merged.json
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/prepublish_gate.ts

      # The canonical tarball's basename is npm pack's stdout. The root output
      # is already ignored by /rig-c-*.tgz; all tracked source bytes stay put.
      # npm pack has no prepublishOnly hook, and this package has no prepare or
      # prepack hook. The unchanged folder hook still gates manual publication.
      - name: Publish to npm
        env:
          TREE_VERDICT_PATH: ${{ steps.reuse.outputs.verdict-path }}
        run: |
          set -euo pipefail
          canonical_tgz="$(npm pack . --pack-destination .)"
          npm publish "$canonical_tgz" --provenance --access public

      # 🪞 The aliases: the same files under the convenience unscoped name
      # `rig-c` (issue #1258) and under the name the package first shipped
      # as (issue #1258), so a dependant that still names `spine-rigc` keeps
      # receiving every version. One step per alias, each the same
      # three lines: `scripts/alias_tarball.ts` packs this checkout
      # — the tagged commit the step above published from — into the runner's
      # temp directory, rewrites the one `"name"` line of the extracted
      # package.json, packs that again, and prints the path only after holding
      # the result to the package tarball file by file. The checkout is never
      # modified, so the confirmation below reads the tree the gate read.
      #
      # Every publication consumes a tarball after the one named reader.
      # The alias helper retains its byte comparison and rewrites the name
      # only in its extraction. The checkout's tracked inputs stay fixed.
      - name: Publish the alias rig-c
        env:
          TREE_VERDICT_PATH: ${{ steps.reuse.outputs.verdict-path }}
        run: |
          set -euo pipefail
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name rig-c --out "$RUNNER_TEMP/alias-rig-c")"
          npm publish "$alias_tgz" --provenance --access public

      - name: Publish the alias spine-rigc
        env:
          TREE_VERDICT_PATH: ${{ steps.reuse.outputs.verdict-path }}
        run: |
          set -euo pipefail
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name spine-rigc --out "$RUNNER_TEMP/alias-spine-rigc")"
          npm publish "$alias_tgz" --provenance --access public

      # ROADMAP.md's fourth condition for 1.0 says "installing FROM THE REGISTRY
      # and running a build is checked mechanically, every release" — this is
      # that sentence, and it is deliberately the smaller half of issue #556.
      #
      # ⚖️ The GATE is the `installs` job in ci.yml, which runs the same script
      # over a tarball packed from the branch, on every pull request, with three
      # planted packages that have to make it red. This step cannot be the gate,
      # and the reason is the one this repository applies to every check: its own
      # firing cannot be observed without publishing something broken, and a
      # check nobody can see fail is not a check. What it adds is the one thing
      # the gate cannot reach — the artifact the registry actually serves, rather
      # than the one this tree packs — so it runs as a confirmation beside the
      # gate. A red here does not un-publish anything; it says the cut needs a
      # follow-up, which is a true and useful thing to be told.
      #
      # ⏳ The wait is for propagation and nothing else, and it belongs to the
      # script rather than to this file (issue #563). Two reasons, both
      # measured: the sixty seconds this body used to sleep were shorter than
      # the registry took on all three of the cuts that ran it — 4 min 11 s,
      # 2 min 07 s, 2 min 38 s — and a `run:` body cannot be red-firsted
      # anywhere, while `--wait` inside the script is driven by four selftest
      # controls against a fake registry on `PATH`. Since issue #833 the wait
      # ends on the tarball rather than the packument: v1.1.0's packument
      # answered minutes before its bytes did, and this step printed that as an
      # artifact that does not build.
      #
      # 🚨 What the script separates, and what this step used to print the same
      # red for: a version the registry has not served yet says NOTHING about
      # the package (exit 3, "confirmation NOT taken"), and a case going red on
      # an artifact the registry did serve says the published artifact does not
      # build (exit 1). The old body ended both in `npm view`'s raw `E404`.
      #
      # 🪞 Each `--alias` adds one more name: after the case, the same version
      # under that alias is fetched, within what is left of the same wait, and
      # its unpacked files are held to the ones the case installed — every
      # path, every byte, the manifest's name line excepted (issues #1258,
      # #1347). One `--alias` per name, every name `ALIASES` lists.
      # Compared rather than installed a second time: identical files are the
      # stronger claim, and the comparison takes seconds. A difference is exit
      # 1; an alias still arriving is exit 3, re-run by the dispatch below.
      - name: Confirm the published package installs and builds
        # Through the environment rather than interpolated into the script, the
        # same rule ci.yml's jobs state: `${{ }}` inside `run:` is text becoming
        # code, and the habit is worth keeping even where the text is a tag this
        # workflow resolved a moment ago.
        env:
          TAG_NAME: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bun run smoke -- --source registry --version "$version" --wait 15 --case clean --alias rig-c --alias spine-rigc

  # The same confirmation, on demand, for a cut whose wait ran out. It publishes
  # nothing and can publish nothing: `npm publish` exists only in the job above,
  # which a `version` dispatch skips. A `tag` dispatch does not run this job;
  # its own run ends in the confirmation step above.
  confirm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    # Above the 15-minute wait, with the install and the build under it.
    timeout-minutes: 25
    permissions:
      contents: read # the tree that published this version, to run its smoke from
    steps:
      # The tag, rather than whatever `main` holds now: the confirmation asks
      # whether the artifact THAT cut published installs and builds, so the
      # script asking it should be that cut's.
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: oven-sh/setup-bun@v2

      # npm packs and installs, and the `bin` shim is a Node script — the
      # runner's node is half of what the smoke is measuring, as in ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm the published package installs and builds
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun run smoke -- --source registry --version "$VERSION" --wait 15 --case clean --alias rig-c --alias spine-rigc
