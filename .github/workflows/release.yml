# Release: the cut is one click, and no credential exists to leak.
#
# Every push to main hands the commits to release-please, which keeps a
# "release: vX.Y.Z" pull request open — next version derived from the
# conventional-commit subjects, CHANGELOG.md generated, package.json bumped.
# Merging that pull request is the release: the resulting push runs this
# workflow again, release-please tags vX.Y.Z and cuts the GitHub release, and
# the same run publishes to npm over OIDC (trusted publishing) — no npm token,
# no OTP. It publishes the package three times, under three names: `rig-c`,
# the name in package.json, and two aliases carrying the same files at every
# version — `spine-rigc`, the name it first shipped under (issue #1258), and
# `@rig-c/core`, the same package under the toolchain's npm scope (issue
# #1347). `ALIASES` in scripts/alias_tarball.ts is the list; CUR122 holds the
# publish steps and both confirmation calls below to it.
#
# Since issue #1249 that run is three jobs and a call: `plan` (release-please)
# → `gate` (the selftest as n shards and their merge, selftest-shards.yml, the
# same file ci.yml calls, over the tag) → `publish` (`npm publish`, whose
# `prepublishOnly` reads the merged tally the gate wrote instead of running the
# whole selftest again in one process) and the confirmation. `CUR119` in
# selftest.ts holds that order.
#
# A failure after the tag leaves a version unpublished: release-please has cut
# the tag and the GitHub release, so a re-run no longer reports
# `release_created` and `gate` and `publish` are skipped, while the registry
# keeps serving the previous version (issue #1504: a transient signing-service
# 502 on `npm publish --provenance`, on another package of the toolchain). A
# publish by hand would lose provenance, and the trusted publisher names this
# file. Such a tag is published by a dispatch with the `tag` input
# (`gh workflow run release.yml -f tag=vX.Y.Z --ref vX.Y.Z`, for a tag carrying
# the guard below): `plan` skips release-please
# and resolves the tag, then the same `gate` and the same `publish` run over
# it, from this same filename. The trusted publisher is unchanged, but npm
# records the dispatch's GITHUB_REF/GITHUB_SHA, not checkout's HEAD. The publish
# job refuses a dispatch whose SHA differs from that HEAD before any name is
# published (PROVENANCE_SHA_MISMATCH, issue #1542). The dispatched ref must
# itself carry this guard; an older tag's workflow is not retroactively fixed.
# There is no path to `publish` that does not pass the gate
# (RELEASING.md, "Republishing a cut whose publish failed"). `CUR131` holds
# that shape and names each refusal.
#
# The dispatch takes exactly one of two inputs, both optional, because GitHub
# refuses a dispatch that omits a required input and an omitted string input
# reads as the empty string: `tag` publishes a cut tag (`plan` → `gate` →
# `publish`), `version` re-runs a confirmation (`confirm` alone). Both, or
# neither, is refused by name in `plan` (RELEASE_DISPATCH_INPUT) and runs
# nothing else.
#
# Two constraints are load-bearing, do not "simplify" them away:
#   - Every publish must stay in THIS file. npm's trusted publisher for each
#     name — rig-c, spine-rigc and @rig-c/core, one form per package on npmjs.com — is
#     pinned to the workflow filename `release.yml`.
#   - It must stay on a GitHub-hosted runner. npm does not support OIDC from
#     self-hosted runners.
name: release

on:
  push:
    branches: [main]
  # Two things on demand, one per dispatch:
  #   - `version`: re-run a confirmation that ran out of wait, publishing
  #     nothing (issue #563: the confirmation is the last step of a cut and the
  #     registry can take minutes to serve what was just published, so the
  #     outcome "not confirmed yet" has to be repairable by itself). Such a
  #     dispatch reaches the `confirm` job and nothing else: `plan`'s `if` does
  #     not admit a dispatch with a version and no tag, and `gate` and
  #     `publish` need `plan`.
  #   - `tag`: publish a tag release-please already cut whose publish did not
  #     land (issue #1504). Release-please is a step held to a push, so a
  #     dispatch cannot cut a tag or a GitHub release. `plan`'s resolve step
  #     refuses a tag not of the form vX.Y.Z (RELEASE_TAG_FORM), a prerelease
  #     tag (RELEASE_TAG_PRERELEASE: everything here publishes under latest,
  #     and release-please here cuts no prerelease, so there is no dist-tag
  #     path to send one down until a card configures one and removes this
  #     refusal with it), a tag with no GitHub release
  #     (RELEASE_TAG_UNRELEASED), a version the registry already serves under
  #     rig-c (RELEASE_ALREADY_PUBLISHED) and a version below the registry's
  #     latest (RELEASE_TAG_BELOW_LATEST: npm 12.2.0's publish
  #     refuses to put latest on a version below the highest one implicitly,
  #     and the publish steps below pass no `--tag`). A tag it resolves runs
  #     the whole `gate` and then `publish`, as the push that cut it would have.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag whose publish did not land, e.g. v2.64.1 (leave version empty)
        required: false
        type: string
      version:
        description: The published version to confirm, without the leading v, e.g. 2.64.1 (leave tag empty)
        required: false
        type: string

permissions: {}

concurrency:
  # One group for every run that may publish, and one for a confirmation
  # (issue #1510). A push cut and a `tag` dispatch both reach `publish`, so they
  # share `release-publish`: a `tag` dispatch queues behind a cut in flight and
  # a cut behind a republish, and two pushes still serialise. A `version`
  # dispatch publishes nothing and runs in `release-confirm`, so it never waits
  # behind a release. The ref is not in the group, because the registry is one
  # per package rather than per ref and a dispatch may name any ref. Keyed on
  # the event name alone, as it was, a republish and a cut never queued behind
  # each other while a confirmation queued behind a republish. `CUR132`
  # evaluates this expression over a push, a `tag` and a `version` dispatch.
  group: release-${{ (github.event_name == 'workflow_dispatch' && inputs.tag == '') && 'confirm' || 'publish' }}
  cancel-in-progress: false

jobs:
  # 🔒 Release-please — the release commit, the tag and the GitHub release —
  # is a step of this job held to a push, so no dispatch can cut anything. The
  # job runs on a push and on a dispatch that is not a confirmation alone: on a
  # `tag` dispatch it only resolves the tag, and a dispatch with both inputs or
  # neither reaches the resolve step only to be refused there. Its outputs
  # `publish` and `tag` are the one condition and the one tag `gate` and
  # `publish` read, whichever event resolved them — so the dispatch path is
  # not a second graph, and it cannot reach `publish` without `gate`.
  plan:
    if: ${{ github.event_name == 'push' || inputs.tag != '' || inputs.version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commit, tag, GitHub release; the resolve step reads the release
      pull-requests: write # open and update the release PR
      issues: write # release-please labels
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          # GITHUB_TOKEN is the intended default here. Its one limitation is
          # that the `pull_request` run its PR starts has no permission to run
          # until somebody approves it, so the release PR's required check is
          # blocked rather than absent — see RELEASING.md for that approve step
          # and how to opt into RELEASE_PLEASE_TOKEN if it ever stops being
          # enough. The fallback below needs no edit to this file.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # What to publish: on a push, the tag release-please just cut, if it cut
      # one; on a dispatch, the `tag` input once it is a cut tag the registry
      # does not serve yet and that is not below its latest. Each refusal is
      # one `::error::` line naming its rule, and fails this job, so `gate`
      # and `publish` never start. The inputs reach the script through the
      # environment, never interpolated. The package name is written here
      # rather than read from package.json because this job checks nothing
      # out; `CUR131` holds the two `npm view` reads to package.json's name.
      # The semver order is computed in node, not `sort -V`, which sorts
      # 1.0.0-rc.1 after 1.0.0.
      - name: Resolve the tag to publish
        id: target
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ steps.release.outputs.release_created }}
          CUT_TAG: ${{ steps.release.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            if [ "$CREATED" = true ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$CUT_TAG" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -n "$INPUT_TAG" ] && [ -n "$INPUT_VERSION" ]; then echo "::error::RELEASE_DISPATCH_INPUT: both tag \"$INPUT_TAG\" and version \"$INPUT_VERSION\" were given; a dispatch takes tag (publish a cut tag) or version (re-run a confirmation), one of them"; exit 1; fi
          if [ -z "$INPUT_TAG" ]; then echo "::error::RELEASE_DISPATCH_INPUT: neither tag nor version was given; a dispatch takes tag (publish a cut tag) or version (re-run a confirmation), one of them"; exit 1; fi
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then echo "::error::RELEASE_TAG_FORM: \"$INPUT_TAG\" is not vX.Y.Z (or vX.Y.Z-<prerelease>)"; exit 1; fi
          case "$INPUT_TAG" in *-*) echo "::error::RELEASE_TAG_PRERELEASE: $INPUT_TAG is a prerelease; this workflow publishes under latest only — its publish steps pass no --tag and release-please here cuts no prerelease — so a prerelease dispatch would move latest onto it (RELEASING.md)"; exit 1;; esac
          if ! gh release view "$INPUT_TAG" --repo "$REPO" >/dev/null 2>&1; then echo "::error::RELEASE_TAG_UNRELEASED: $INPUT_TAG has no GitHub release in $REPO; only a tag release-please cut is published"; exit 1; fi
          version="${INPUT_TAG#v}"
          if served="$(npm view "rig-c@$version" version 2>/dev/null)" && [ "$served" = "$version" ]; then echo "::error::RELEASE_ALREADY_PUBLISHED: the registry already serves rig-c@$version; the aliases publish after it, so a version up under the package name is not dispatched again (RELEASING.md)"; exit 1; fi
          if latest="$(npm view "rig-c" version 2>/dev/null)" && [ -n "$latest" ] && [ "$(VERSION="$version" LATEST="$latest" node -e '
            const parse = (v) => { const [core, pre] = v.split("-", 2); return { core: core.split(".").map(Number), pre: pre === undefined ? null : pre.split(".") }; };
            const ids = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i] === undefined) return -1; if (b[i] === undefined) return 1; const na = /^[0-9]+$/.test(a[i]), nb = /^[0-9]+$/.test(b[i]); if (na && nb && Number(a[i]) !== Number(b[i])) return Number(a[i]) - Number(b[i]); if (na !== nb) return na ? -1 : 1; if (!na && a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; };
            const cmp = (x, y) => { const a = parse(x), b = parse(y); for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i]; if (a.pre === null || b.pre === null) return a.pre === b.pre ? 0 : a.pre === null ? 1 : -1; return ids(a.pre, b.pre); };
            process.stdout.write(cmp(process.env.VERSION, process.env.LATEST) < 0 ? "below" : "not-below");
          ')" = below ]; then echo "::error::RELEASE_TAG_BELOW_LATEST: $INPUT_TAG is below the registry's latest rig-c@$latest; npm will not put latest on it implicitly and these publish steps pass no --tag, so it is not published by this dispatch (RELEASING.md)"; exit 1; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

  # The whole selftest over the tag, as CI runs it on every change: six shards
  # on six runners and the merge that is the verdict, from the one file both
  # workflows call. Only on a tag `plan` resolved: the push that merged the
  # release PR, or a dispatched tag that passed the refusals — a `tag`
  # dispatch runs this whole gate over the tag as well. The merge uploads
  # `selftest-merged-tally`, which names the commit it ran at; a red merge
  # fails this job and `publish` never starts.
  gate:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    permissions:
      contents: read # check out the tag
    uses: ./.github/workflows/selftest-shards.yml
    with:
      ref: ${{ needs.plan.outputs.tag }}

  # Everything below runs only on a tag `plan` resolved — the push that merged
  # the release PR, or a dispatched tag — and only once `gate` is green.
  publish:
    needs: [plan, gate]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    # ⏱️ The ceiling covers this job alone now; the selftest runs in `gate`,
    # which has its own ceilings (30 min a shard, 15 the merge). What is left
    # here: ~1 min of setup, ~1 min of corpus fetch, typecheck and lint under
    # `prepublishOnly` (well under a minute in ci.yml's merge job), the pack and
    # the upload, then up to 15 min of registry wait (see the confirmation
    # below) and the confirmation's install and build: ~4 min plus the wait on
    # the path where the tally is accepted. The ceiling is sized for the other
    # path, because that is the one a ceiling can cut short: a refused tally
    # runs the one-process selftest here, which made `Publish to npm` 18m37s on
    # its own (v2.20.0, run 37724479086) — ~21 min to the publish, + 15 of
    # wait + the confirmation's ~2 = 38, so 40. The alias (issue #1258) adds
    # its pack and publish — about a second to pack, measured on this tree —
    # and no second wait: its confirmation asks within what is left of the 15. Measured on the first cut
    # after #1249 (v2.20.3, run on 2026-10-08): `plan` 14 s, `gate` 5m59s
    # (shards 2m06s–3m59s, the merge 1m19s), this job 4m27s of which the
    # tally was accepted 62 s in and the registry served the package on
    # attempt 9 (3m09s) — 10m43s end to end against the ~21 min before, and
    # the accepted path's publish is under 1.5 min before the wait.
    timeout-minutes: 40
    permissions:
      contents: read # check out the tag
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      # npm's provenance reads GITHUB_SHA, not the tag checkout's HEAD. Keep
      # this before every publish, including aliases, and leave pushes alone.
      # A dispatch runs the workflow on its selected ref: only refs containing
      # this guard enforce it; --ref on an old tag cannot acquire a newer guard.
      - name: Refuse dispatched provenance from a different commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            checked_out_sha="$(git rev-parse HEAD)"
            if [ "$GITHUB_SHA" != "$checked_out_sha" ]; then
              echo "::error::PROVENANCE_SHA_MISMATCH: GITHUB_SHA=$GITHUB_SHA differs from checked-out HEAD=$checked_out_sha; dispatch from a ref at the tag's commit whose release.yml contains this guard"
              exit 1
            fi
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC exchange landed in npm 11.5.1.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # The repository's lockfile is bun.lock — there is no package-lock.json,
      # so `npm ci` has nothing to read. Deps exist only to let prepublishOnly
      # run its gates; the publish itself is npm's.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # There is nothing to build — the package ships TypeScript sources and
      # bun runs them. What guards the publish instead is prepublishOnly,
      # `scripts/prepublish_gate.ts`: `typecheck` and `lint` against the tagged
      # tree, then either the merged tally `gate` wrote — accepted only when it
      # names this checkout's commit, every shard green and present, the merge
      # exited 0 and every registered suite accounted for — or, on anything
      # else, the full selftest in this job. So the corpus is still fetched
      # here, before the publish, exactly as the shards fetch it — same script,
      # same token — because the fallback has to read the tree the gate read.
      #
      # 🚨 This used to say the selftest needs no corpus, and that stopped being
      # true when the core suite landed: with no examples/ its corpus controls
      # are red rather than HOLEs (a construct no row reaches is never a pass,
      # and a plant that reaches nothing is a fault). v1.6.0 was tagged and
      # released on GitHub and then failed this gate on four of them, because
      # the publish was measuring a different environment from the gate that
      # admitted every commit (issue #1003). `CUR112` in selftest.ts holds this
      # step before the publish, under the publish's own condition.
      - name: Fetch the Spine example corpus
        run: bun run fetch-examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the merged tally the gate wrote
        uses: actions/download-artifact@v4
        with:
          name: selftest-merged-tally
          path: ${{ runner.temp }}/merged-tally

      # `RIGC_PREPUBLISH_TALLY` is set on this step and nowhere else (`CUR119`):
      # it names evidence `prepublishOnly` checks, never a switch, and the
      # line that step prints — "accepted tally <path> for <sha>: …" or the
      # reasons it was not — is the record of which gate this publish read.
      - name: Publish to npm
        env:
          RIGC_PREPUBLISH_TALLY: ${{ runner.temp }}/merged-tally/selftest_merged.json
        run: npm publish --provenance --access public

      # 🪞 The aliases: the same files under the name the package first shipped
      # as (issue #1258), so a dependant that still names `spine-rigc` keeps
      # receiving every version, and under the toolchain's scope as
      # `@rig-c/core` (issue #1347) — scoped, so `--access public` is what
      # keeps it from publishing restricted. One step per alias, each the same
      # three lines: `scripts/alias_tarball.ts` packs this checkout
      # — the tagged commit the step above published from — into the runner's
      # temp directory, rewrites the one `"name"` line of the extracted
      # package.json, packs that again, and prints the path only after holding
      # the result to the package tarball file by file. The checkout is never
      # modified, so the confirmation below reads the tree the gate read.
      #
      # 🔒 No lifecycle script runs here, and that is the design rather than a
      # gap: `npm publish <tarball>` runs none, so `prepublishOnly` gates the
      # step above and only that one. Running it again could not mean anything —
      # renaming the package in this tree leaves it modified, which the tally
      # reader refuses (TALLY_DIRTY), and the fallback would run the whole
      # selftest over a tree that is no longer the commit the gate ran at. The
      # gate's verdict is about this commit, and the alias is this commit's
      # files.
      - name: Publish the alias spine-rigc
        run: |
          set -euo pipefail
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name spine-rigc --out "$RUNNER_TEMP/alias-spine-rigc")"
          npm publish "$alias_tgz" --provenance --access public

      - name: Publish the alias @rig-c/core
        run: |
          set -euo pipefail
          alias_tgz="$(bun scripts/alias_tarball.ts pack --name @rig-c/core --out "$RUNNER_TEMP/alias-rig-c-core")"
          npm publish "$alias_tgz" --provenance --access public

      # ROADMAP.md's fourth condition for 1.0 says "installing FROM THE REGISTRY
      # and running a build is checked mechanically, every release" — this is
      # that sentence, and it is deliberately the smaller half of issue #556.
      #
      # ⚖️ The GATE is the `installs` job in ci.yml, which runs the same script
      # over a tarball packed from the branch, on every pull request, with three
      # planted packages that have to make it red. This step cannot be the gate,
      # and the reason is the one this repository applies to every check: its own
      # firing cannot be observed without publishing something broken, and a
      # check nobody can see fail is not a check. What it adds is the one thing
      # the gate cannot reach — the artifact the registry actually serves, rather
      # than the one this tree packs — so it runs as a confirmation beside the
      # gate. A red here does not un-publish anything; it says the cut needs a
      # follow-up, which is a true and useful thing to be told.
      #
      # ⏳ The wait is for propagation and nothing else, and it belongs to the
      # script rather than to this file (issue #563). Two reasons, both
      # measured: the sixty seconds this body used to sleep were shorter than
      # the registry took on all three of the cuts that ran it — 4 min 11 s,
      # 2 min 07 s, 2 min 38 s — and a `run:` body cannot be red-firsted
      # anywhere, while `--wait` inside the script is driven by four selftest
      # controls against a fake registry on `PATH`. Since issue #833 the wait
      # ends on the tarball rather than the packument: v1.1.0's packument
      # answered minutes before its bytes did, and this step printed that as an
      # artifact that does not build.
      #
      # 🚨 What the script separates, and what this step used to print the same
      # red for: a version the registry has not served yet says NOTHING about
      # the package (exit 3, "confirmation NOT taken"), and a case going red on
      # an artifact the registry did serve says the published artifact does not
      # build (exit 1). The old body ended both in `npm view`'s raw `E404`.
      #
      # 🪞 Each `--alias` adds one more name: after the case, the same version
      # under that alias is fetched, within what is left of the same wait, and
      # its unpacked files are held to the ones the case installed — every
      # path, every byte, the manifest's name line excepted (issues #1258,
      # #1347). One `--alias` per name, every name `ALIASES` lists.
      # Compared rather than installed a second time: identical files are the
      # stronger claim, and the comparison takes seconds. A difference is exit
      # 1; an alias still arriving is exit 3, re-run by the dispatch below.
      - name: Confirm the published package installs and builds
        # Through the environment rather than interpolated into the script, the
        # same rule ci.yml's jobs state: `${{ }}` inside `run:` is text becoming
        # code, and the habit is worth keeping even where the text is a tag this
        # workflow resolved a moment ago.
        env:
          TAG_NAME: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bun run smoke -- --source registry --version "$version" --wait 15 --case clean --alias spine-rigc --alias @rig-c/core

  # The same confirmation, on demand, for a cut whose wait ran out. It publishes
  # nothing and can publish nothing: `npm publish` exists only in the job above,
  # which a `version` dispatch skips. A `tag` dispatch does not run this job;
  # its own run ends in the confirmation step above.
  confirm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.tag == '' }}
    runs-on: ubuntu-latest
    # Above the 15-minute wait, with the install and the build under it.
    timeout-minutes: 25
    permissions:
      contents: read # the tree that published this version, to run its smoke from
    steps:
      # The tag, rather than whatever `main` holds now: the confirmation asks
      # whether the artifact THAT cut published installs and builds, so the
      # script asking it should be that cut's.
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: oven-sh/setup-bun@v2

      # npm packs and installs, and the `bin` shim is a Node script — the
      # runner's node is half of what the smoke is measuring, as in ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm the published package installs and builds
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun run smoke -- --source registry --version "$VERSION" --wait 15 --case clean --alias spine-rigc --alias @rig-c/core
